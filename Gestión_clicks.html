<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contador de Clicks</title>
<style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: blue;
            text-align: center;
        }

        p {
            color: black;
        }
    </style>
</head>
<body>
  <h1>Contador de Clicks</h1>
  <button id="btn">Haz clic</button>
  <p id="contador">0</p>

  <script>
    let contador = 0;
    document.getElementById("btn").addEventListener("click", () => {
      contador++;
      document.getElementById("contador").innerText = contador;
    });
   let click = 0;
  </script>

<p>Click: <span id="c">0</span></p>
  <button onclick="document.getElementById('c').innerText = ++click">Sumar</button>
  <button onclick="click = 0; document.getElementById('c').innerText = 0">Reiniciar</button>
 
</body>
</html>
