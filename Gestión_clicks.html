<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contador de Clicks</title>
<style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: blue;
            text-align: center;
        }

        p {
            color: black;
        }
    </style>
</head>
<body>

  <h1>Contador de Clicks Alex Reyes, Jorge Calvo, Loubna Mechnane, Sarah Sebastian</h1>
  <button id="btn">Haz clic</button>
  <p id="contador">0</p>

  <script>
    let contador = 0;

    document.getElementById("btn").addEventListener("click", () => {
      contador++;
      document.getElementById("contador").innerText = contador;
    });
  </script>

  <p id="hora"></p>

  <script>
    document.getElementById("btn").addEventListener("click", () => {

      const ahora = new Date();
      document.getElementById("hora").innerText = "Último clic: " + ahora.toLocaleTimeString();
    });
  </script>

  <button id="reset">Reiniciar</button>

  <script>
    document.getElementById("reset").addEventListener("click", () => {
      contador = 0;
      document.getElementById("contador").innerText = contador;
    });
  </script>
</body>
</html>
